name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The render goldens were recorded on macOS, so they are compared there
    runs-on: macos-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: ./node_modules/.bin/turbo run typecheck test
      - run: ./node_modules/.bin/turbo boundaries
      - run: bun run --cwd apps/examples build
      - name: No file changed, such as a snapshot written by the tests
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
